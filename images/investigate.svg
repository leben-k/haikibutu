<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" role="img" aria-labelledby="t">
  <title id="t">捨てた人を調べる方法：ごみの中の手がかりを調べる、カメラの映像で車を確認する</title>
  <g font-family="'Hiragino Sans','Noto Sans JP','Noto Sans CJK JP','Yu Gothic',Meiryo,sans-serif" font-weight="800" text-anchor="middle">
  <rect width="800" height="330" rx="24" fill="#fff8e1"/>
  <!-- left: magnifier over trash -->
  <g stroke="#333" stroke-width="3">
    <path d="M70 270 q-10 -90 80 -95 q90 5 80 95z" fill="#757575"/>
    <rect x="120" y="200" width="70" height="45" fill="#fff" />
    <path d="M120 200 L155 225 L190 200" fill="none"/>
  </g>
  <g>
    <circle cx="215" cy="170" r="55" fill="#e3f2fd" fill-opacity=".6" stroke="#5d4037" stroke-width="12"/>
    <path d="M255 210 L300 255" stroke="#5d4037" stroke-width="18" stroke-linecap="round"/>
  </g>
  <text x="185" y="305" font-size="22" fill="#e65100">ごみの中の手がかり</text>
  <!-- right: camera monitor -->
  <g transform="translate(450 50)">
    <rect width="290" height="190" rx="12" fill="#263238"/>
    <rect x="15" y="15" width="260" height="150" fill="#37474f"/>
    <rect x="15" y="125" width="260" height="40" fill="#4e342e"/>
    <rect x="70" y="80" width="120" height="50" rx="6" fill="#ef6c00"/>
    <rect x="190" y="90" width="50" height="40" rx="6" fill="#f57c00"/>
    <circle cx="100" cy="135" r="13" fill="#111"/><circle cx="215" cy="135" r="13" fill="#111"/>
    <rect x="245" y="105" width="22" height="14" fill="#fff"/>
    <circle cx="35" cy="32" r="7" fill="#e53935"/>
    <text x="80" y="38" font-size="16" fill="#fff" text-anchor="start">REC 02:13</text>
    <rect x="125" y="190" width="40" height="25" fill="#263238"/>
  </g>
  <text x="595" y="305" font-size="22" fill="#e65100">カメラ映像・目撃情報</text>
  <text x="400" y="40" font-size="20" fill="#424242">調べるのは市町村・都道府県・警察</text>
  </g>
</svg>
