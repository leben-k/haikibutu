<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" role="img" aria-labelledby="t">
  <title id="t">マニフェストの流れ：出した会社から運ぶ業者、処分する業者へ伝票がついていき、最後に出した会社へ戻る</title>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#1565c0"/></marker></defs>
  <g font-family="'Hiragino Sans','Noto Sans JP','Noto Sans CJK JP','Yu Gothic',Meiryo,sans-serif" font-weight="800" text-anchor="middle">
  <rect width="800" height="320" rx="24" fill="#f1f8ff"/>
  <g transform="translate(40 50)">
    <rect width="180" height="120" rx="14" fill="#fff" stroke="#1565c0" stroke-width="4"/>
    <path d="M40 95V45L70 30V45L100 30V95Z" fill="#b0bec5" stroke="#333" stroke-width="3"/>
    <rect x="110" y="40" width="14" height="55" fill="#78909c"/>
    <text x="90" y="150" font-size="22" fill="#0d47a1">①出した会社</text>
  </g>
  <g transform="translate(310 50)">
    <rect width="180" height="120" rx="14" fill="#fff" stroke="#1565c0" stroke-width="4"/>
    <rect x="30" y="45" width="80" height="40" fill="#ef6c00" stroke="#333" stroke-width="3"/>
    <rect x="110" y="55" width="40" height="30" fill="#f57c00" stroke="#333" stroke-width="3"/>
    <circle cx="55" cy="90" r="10" fill="#212121"/><circle cx="130" cy="90" r="10" fill="#212121"/>
    <text x="90" y="150" font-size="22" fill="#0d47a1">②運ぶ業者</text>
  </g>
  <g transform="translate(580 50)">
    <rect width="180" height="120" rx="14" fill="#fff" stroke="#1565c0" stroke-width="4"/>
    <path d="M40 95V55H140V95Z" fill="#a1887f" stroke="#333" stroke-width="3"/>
    <path d="M60 55V35H80V55" fill="#8d6e63" stroke="#333" stroke-width="3"/>
    <text x="90" y="150" font-size="22" fill="#0d47a1">③処分する業者</text>
  </g>
  <g stroke="#1565c0" stroke-width="5" fill="none" marker-end="url(#a)">
    <path d="M225 110H302"/><path d="M495 110H572"/>
    <path d="M670 210 Q400 290 130 210"/>
  </g>
  <g transform="translate(372 205)">
    <rect width="56" height="66" rx="4" fill="#fffde7" stroke="#f9a825" stroke-width="3"/>
    <path d="M10 18H46M10 32H46M10 46H34" stroke="#f9a825" stroke-width="3"/>
  </g>
  <text x="400" y="34" font-size="24" fill="#0d47a1">伝票（マニフェスト）がごみについていく</text>
  <text x="400" y="305" font-size="18" fill="#424242">「ちゃんと処分しました」と報告が戻る</text>
  </g>
</svg>
