<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-labelledby="t">
  <title id="t">不法投棄を防ぐ工夫：柵、看板、監視カメラ、街灯、花壇</title>
  <g font-family="'Hiragino Sans','Noto Sans JP','Noto Sans CJK JP','Yu Gothic',Meiryo,sans-serif" font-weight="800" text-anchor="middle">
  <rect width="800" height="340" fill="#e8f5e9"/>
  <rect y="250" width="800" height="90" fill="#a5d6a7"/>
  <!-- fence -->
  <g fill="#fff" stroke="#5d4037" stroke-width="3">
    <rect x="30" y="170" width="16" height="90"/><rect x="80" y="170" width="16" height="90"/><rect x="130" y="170" width="16" height="90"/><rect x="180" y="170" width="16" height="90"/>
    <rect x="20" y="190" width="190" height="12"/><rect x="20" y="225" width="190" height="12"/>
  </g>
  <text x="115" y="300" font-size="22" fill="#1b5e20">柵・チェーン</text>
  <!-- sign -->
  <rect x="300" y="190" width="10" height="75" fill="#6d4c2f"/>
  <rect x="245" y="125" width="120" height="70" rx="8" fill="#fff" stroke="#c62828" stroke-width="4"/>
  <text x="305" y="155" font-size="18" fill="#c62828">捨てるな</text>
  <text x="305" y="182" font-size="15" fill="#c62828">カメラ監視中</text>
  <text x="305" y="300" font-size="22" fill="#1b5e20">看板</text>
  <!-- camera -->
  <rect x="455" y="110" width="10" height="155" fill="#616161"/>
  <g transform="rotate(18 470 115)">
    <rect x="440" y="95" width="80" height="36" rx="6" fill="#eceff1" stroke="#333" stroke-width="3"/>
    <circle cx="525" cy="113" r="12" fill="#263238"/>
  </g>
  <circle cx="452" cy="102" r="6" fill="#e53935"/>
  <text x="470" y="300" font-size="22" fill="#1b5e20">監視カメラ</text>
  <!-- light -->
  <rect x="595" y="80" width="10" height="185" fill="#546e7a"/>
  <path d="M600 80 h40 v10 h-40z" fill="#546e7a"/>
  <path d="M625 90 h30 l8 18 h-46z" fill="#ffee58" stroke="#333" stroke-width="2"/>
  <path d="M620 108 L590 250 H690 L670 108Z" fill="#fff59d" opacity=".5"/>
  <text x="625" y="300" font-size="22" fill="#1b5e20">明かり</text>
  <!-- flowers -->
  <g>
    <rect x="700" y="230" width="85" height="30" rx="5" fill="#8d6e63"/>
    <g><circle cx="718" cy="218" r="9" fill="#ec407a"/><circle cx="742" cy="212" r="9" fill="#ffca28"/><circle cx="766" cy="218" r="9" fill="#ab47bc"/></g>
  </g>
  <text x="742" y="300" font-size="22" fill="#1b5e20">花壇</text>
  <text x="400" y="45" font-size="28" fill="#1b5e20">「見られている」「手入れされている」が一番の防止策</text>
  </g>
</svg>
