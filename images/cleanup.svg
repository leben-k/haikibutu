<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" role="img" aria-labelledby="t">
  <title id="t">片付けの前と後：ごみが捨てられた空き地が、撤去と再発防止で花のある場所に変わる</title>
  <g font-family="'Hiragino Sans','Noto Sans JP','Noto Sans CJK JP','Yu Gothic',Meiryo,sans-serif" font-weight="900" text-anchor="middle">
  <rect x="10" y="10" width="340" height="280" rx="18" fill="#efebe9"/>
  <rect x="10" y="200" width="340" height="90" fill="#a1887f"/>
  <g stroke="#333" stroke-width="3">
    <rect x="60" y="160" width="60" height="45" fill="#bdbdbd"/>
    <path d="M130 210 q-10 -60 30 -62 q40 2 30 62z" fill="#424242"/>
    <circle cx="230" cy="190" r="20" fill="#212121"/>
    <path d="M260 210 l20 -40 l40 8 l-15 32z" fill="#8d6e63"/>
  </g>
  <text x="180" y="60" font-size="30" fill="#5d4037">片付け前</text>
  <path d="M370 150 H430" stroke="#2e7d32" stroke-width="12"/><path d="M425 125 L460 150 L425 175Z" fill="#2e7d32"/>
  <rect x="470" y="10" width="320" height="280" rx="18" fill="#e8f5e9"/>
  <rect x="470" y="200" width="320" height="90" fill="#81c784"/>
  <g fill="#fff" stroke="#5d4037" stroke-width="3"><rect x="490" y="150" width="12" height="60"/><rect x="760" y="150" width="12" height="60"/><rect x="485" y="165" width="292" height="10"/></g>
  <g>
    <circle cx="560" cy="215" r="11" fill="#ec407a"/><circle cx="600" cy="208" r="11" fill="#ffca28"/><circle cx="640" cy="215" r="11" fill="#ab47bc"/><circle cx="680" cy="208" r="11" fill="#ef5350"/><circle cx="720" cy="215" r="11" fill="#42a5f5"/>
  </g>
  <text x="630" y="60" font-size="30" fill="#1b5e20">片付け後</text>
  <text x="630" y="105" font-size="18" fill="#1b5e20">柵と花でまた捨てられない</text>
