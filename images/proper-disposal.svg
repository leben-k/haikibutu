<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="t">
  <title id="t">正しい処分方法：分けて決められた日に出す、粗大ごみは申し込んでシールを貼る、家電4品目はお店へ、頼むときは許可業者へ</title>
  <g font-family="'Hiragino Sans','Noto Sans JP','Noto Sans CJK JP','Yu Gothic',Meiryo,sans-serif" font-weight="900" text-anchor="middle">
  <rect width="800" height="360" rx="24" fill="#f1f8e9"/>
  <text x="400" y="42" font-size="26" fill="#1b5e20">ルールを守れば、ごみは「資源」にもなります</text>
  <!-- 1 bins -->
  <g transform="translate(20 70)">
    <rect width="180" height="210" rx="16" fill="#fff" stroke="#2e7d32" stroke-width="4"/>
    <g stroke="#333" stroke-width="3">
      <path d="M25 70 h40 l-5 80 h-30z" fill="#ef5350"/><rect x="22" y="60" width="46" height="12" rx="3" fill="#c62828"/>
      <path d="M70 70 h40 l-5 80 h-30z" fill="#42a5f5"/><rect x="67" y="60" width="46" height="12" rx="3" fill="#1565c0"/>
      <path d="M115 70 h40 l-5 80 h-30z" fill="#66bb6a"/><rect x="112" y="60" width="46" height="12" rx="3" fill="#2e7d32"/>
    </g>
    <text x="45" y="115" font-size="14" fill="#fff">燃</text><text x="90" y="115" font-size="14" fill="#fff">缶</text><text x="135" y="115" font-size="14" fill="#fff">紙</text>
    <text x="90" y="185" font-size="20" fill="#1b5e20">分けて</text>
    <text x="90" y="210" font-size="17" fill="#212121">決められた日に</text>
  </g>
  <!-- 2 sodai -->
  <g transform="translate(215 70)">
    <rect width="180" height="210" rx="16" fill="#fff" stroke="#2e7d32" stroke-width="4"/>
    <g stroke="#333" stroke-width="3">
      <rect x="40" y="55" width="100" height="70" rx="6" fill="#a1887f"/>
      <rect x="40" y="125" width="14" height="20" fill="#6d4c41"/><rect x="126" y="125" width="14" height="20" fill="#6d4c41"/>
      <rect x="90" y="68" width="40" height="28" fill="#fff59d"/>
    </g>
    <text x="110" y="88" font-size="12" fill="#e65100">処理券</text>
    <text x="90" y="185" font-size="20" fill="#1b5e20">粗大ごみは</text>
    <text x="90" y="210" font-size="17" fill="#212121">申し込んでシール</text>
  </g>
  <!-- 3 kaden -->
  <g transform="translate(410 70)">
    <rect width="180" height="210" rx="16" fill="#fff" stroke="#2e7d32" stroke-width="4"/>
    <g stroke="#333" stroke-width="3">
      <rect x="30" y="45" width="50" height="100" rx="6" fill="#e3f2fd"/><path d="M30 80 h50"/>
      <rect x="95" y="70" width="60" height="45" rx="4" fill="#263238"/><rect x="118" y="115" width="14" height="15" fill="#263238"/>
    </g>
    <text x="90" y="185" font-size="20" fill="#1b5e20">家電4品目は</text>
    <text x="90" y="210" font-size="17" fill="#212121">お店に引き取り</text>
  </g>
  <!-- 4 licensed -->
  <g transform="translate(605 70)">
    <rect width="175" height="210" rx="16" fill="#fff" stroke="#2e7d32" stroke-width="4"/>
    <g stroke="#333" stroke-width="3">
      <rect x="20" y="70" width="85" height="50" fill="#43a047"/>
      <rect x="105" y="82" width="45" height="38" rx="4" fill="#66bb6a"/>
      <circle cx="45" cy="125" r="12" fill="#212121"/><circle cx="128" cy="125" r="12" fill="#212121"/>
    </g>
    <circle cx="140" cy="55" r="24" fill="#fdd835" stroke="#333" stroke-width="3"/>
    <text x="140" y="62" font-size="16" fill="#333">許可</text>
    <text x="88" y="185" font-size="20" fill="#1b5e20">頼むときは</text>
    <text x="88" y="210" font-size="17" fill="#212121">許可業者へ</text>
  </g>
  <text x="400" y="330" font-size="18" fill="#424242">※ 分け方・出し方は市区町村ごとに違います。お住まいの地域のルールを確認しましょう</text>
  </g>
</svg>
