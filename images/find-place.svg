<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-labelledby="t">
  <title id="t">捨てられた場所を見つける方法：人工衛星、ドローン、パトロール</title>
  <g font-family="'Hiragino Sans','Noto Sans JP','Noto Sans CJK JP','Yu Gothic',Meiryo,sans-serif" font-weight="800" text-anchor="middle">
  <rect width="800" height="340" fill="#e1f5fe"/>
  <path d="M0 250 L160 160 L300 240 L470 150 L640 250 L800 190 V340 H0Z" fill="#81c784"/>
  <rect y="290" width="800" height="50" fill="#a1887f"/>
  <!-- satellite -->
  <g transform="translate(90 40)">
    <rect x="30" y="10" width="30" height="30" fill="#ffb300" stroke="#333" stroke-width="3"/>
    <rect x="-20" y="15" width="45" height="20" fill="#1e88e5" stroke="#333" stroke-width="2"/>
    <rect x="65" y="15" width="45" height="20" fill="#1e88e5" stroke="#333" stroke-width="2"/>
    <path d="M45 40 L10 190 H80Z" fill="#fff59d" opacity=".4"/>
  </g>
  <text x="135" y="30" font-size="20" fill="#01579b">人工衛星の写真</text>
  <!-- drone -->
  <g transform="translate(390 80)">
    <rect x="-30" y="0" width="60" height="22" rx="6" fill="#455a64"/>
    <path d="M-30 5 H-60 M30 5 H60" stroke="#455a64" stroke-width="6"/>
    <ellipse cx="-62" cy="0" rx="26" ry="5" fill="#90a4ae"/><ellipse cx="62" cy="0" rx="26" ry="5" fill="#90a4ae"/>
    <circle cx="0" cy="28" r="8" fill="#263238"/>
    <path d="M0 34 L-50 150 H50Z" fill="#fff59d" opacity=".4"/>
  </g>
  <text x="390" y="55" font-size="20" fill="#01579b">ドローン</text>
  <!-- trash spot -->
  <g stroke="#333" stroke-width="3"><rect x="365" y="250" width="40" height="30" fill="#bdbdbd"/><circle cx="420" cy="272" r="12" fill="#212121"/></g>
  <!-- patrol person -->
  <g transform="translate(640 170)">
    <circle cx="0" cy="0" r="18" fill="#ffcc80" stroke="#333" stroke-width="3"/>
    <path d="M-18 -8 h36 v-10 h-36z" fill="#1565c0"/>
    <rect x="-20" y="20" width="40" height="60" rx="8" fill="#1565c0" stroke="#333" stroke-width="3"/>
    <rect x="-18" y="40" width="36" height="8" fill="#fdd835"/>
    <path d="M-12 80 V115 M12 80 V115" stroke="#333" stroke-width="8"/>
    <rect x="14" y="-6" width="22" height="12" rx="3" fill="#212121"/>
  </g>
  <text x="640" y="320" font-size="20" fill="#fff">パトロール</text>
  <text x="400" y="320" font-size="20" fill="#fff">ごみを発見！</text>
  </g>
</svg>
